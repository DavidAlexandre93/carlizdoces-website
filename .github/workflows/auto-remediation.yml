name: Auto Remediation

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-security-remediation:
    name: Auto-fix dependency vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Attempt security remediation
        run: |
          npm audit fix --package-lock-only || true
          npm audit fix || true
          npm dedupe || true

      - name: Validate after remediation
        run: |
          npm run lint -- --max-warnings=0
          npm run test:ci
          npm run build
          npm run audit:high

      - name: Create PR for dependency remediation
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(security): automated dependency remediation"
          branch: chore/auto-dependency-remediation
          delete-branch: true
          title: "chore(security): automated dependency remediation"
          body: |
            ## 🤖 Automated dependency remediation

            This PR was generated automatically by the **Auto Remediation** workflow.

            ### What was done
            - Applied `npm audit fix` to resolve vulnerable transitive/direct dependencies.
            - Executed `npm dedupe` to reduce duplicate package trees.
            - Re-validated lint, tests, build and high-severity audit gates.

            ### Why
            - Keep the project continuously protected against known vulnerabilities.
            - Reduce time-to-fix for security findings.

            > If no changes were needed, this PR is not created.
          labels: |
            dependencies
            security
            automated-pr

  quality-bug-remediation:
    name: Auto-fix quality issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Attempt safe automated bug/quality fixes
        run: |
          npm run lint -- --fix || true
          npm run build
          npm run test:ci

      - name: Create PR for quality remediation
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(ci): automated quality remediation"
          branch: chore/auto-quality-remediation
          delete-branch: true
          title: "chore(ci): automated quality remediation"
          body: |
            ## 🤖 Automated quality remediation

            This PR was generated automatically by the **Auto Remediation** workflow.

            ### What was done
            - Ran `eslint --fix` to correct code quality issues automatically.
            - Re-ran build and test suite to validate stability.

            ### Why
            - Reduce manual toil for recurring low-risk fixes.
            - Keep code quality high and CI green.

            > If there are no file changes, this PR is not created.
          labels: |
            bugfix
            ci/cd
            automated-pr
