name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Promover para produção'
        required: true
        default: false
        type: boolean

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT_ID: carliz-doces

jobs:
  package:
    name: Package frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build distributable
        run: npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      - name: Deploy Firebase Hosting preview channel (staging)
        run: npx firebase-tools hosting:channel:deploy staging --project "$FIREBASE_PROJECT_ID" --expires 7d --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - package
      - deploy-staging
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist

      - name: Deploy Firebase Hosting production
        run: npx firebase-tools deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
